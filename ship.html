<script>
/* ============================================================
   SHIP — AI Automation Lab
   Data + render + localStorage
   ============================================================ */

const K = {
  sprint:   'lab.sprint.done.v1',
  learn:    'lab.learn.done.v1',
  build:    'lab.build.state.v1',
  pipeline: 'lab.pipeline.v1',
  money:    'lab.money.v1',
  wow:      'lab.wow.done.v1',
  start:    'lab.startDate.v1'
};
function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch(e) { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let doneSprint = load(K.sprint, {});
let doneLearn  = load(K.learn, {});
let buildState = load(K.build, {});
let pipeline   = load(K.pipeline, []);
let money      = load(K.money, { goal: 10000, entries: [] });
let doneWow    = load(K.wow, {});

/* ============================================================
   SPRINT — 30 days at ~5.5 hrs/day
   ============================================================ */
const SPRINT = [
  { w:1, t:'Week 1 · Foundations + your first three builds',
    goal:'By Sunday you can build any "trigger → logic → action" automation, and you have 3 working demos recorded.',
    days:[
      { d:1, title:'Pick the lane, set up the shop', hrs:5, tasks:[
        'Choose 3 target verticals from the Pitch tab shortlist. Write them down. Do not add a 4th.',
        'Create free accounts: n8n Cloud trial, Make.com free, Airtable, Cal.com, Twilio trial, Google Cloud (for Sheets/Gmail API), Anthropic Console.',
        'Buy a domain for the practice ($12/yr). Set up a Google Workspace or Zoho mailbox on it — never pitch from gmail.com.',
        'Set up a Notion or Obsidian vault: one page per build, one page per prospect. This becomes your case-study source.',
        'Read the whole Pitch tab end to end. Do not skim it.'
      ], out:'Domain live, 8 accounts created, 3 verticals chosen.' },
      { d:2, title:'APIs, webhooks and JSON — the only "coding" you need', hrs:6, tasks:[
        'Learn what an API, endpoint, HTTP verb, header, auth token and payload are. 90 min, no more.',
        'Learn JSON structure: objects, arrays, dot notation. Practice reading a nested response until it is boring.',
        'Make a webhook fire: use webhook.site, then a Make/n8n webhook trigger. Send it data from a form.',
        'Do 5 reps: connect a Google Form → Sheet → Slack/email. Break it on purpose. Fix it.',
        'Write your own one-page cheat sheet of what you learned. You will re-read this on client calls.'
      ], out:'You can read any JSON response and wire a webhook without googling.' },
      { d:3, title:'BUILD 1 — Missed-Call Rescue', hrs:6, tasks:[
        'Build it: Twilio number → missed/unanswered call → instant SMS "Sorry we missed you, what do you need?" → reply routes to owner + logs to Sheet/CRM.',
        'Add business-hours logic and an after-hours variant.',
        'Add a 3-touch follow-up: +10 min, +1 day, +3 days, stopping on reply.',
        'Test it 10 times from your own phone. Every edge case.',
        'Record a 90-second Loom: the problem, the call, the text arriving, the log filling in.'
      ], out:'Build 1 shipped + demo video. This is the single highest-converting demo you own.' },
      { d:4, title:'BUILD 2 — Speed-to-Lead Responder', hrs:6, tasks:[
        'Form/webchat submission → SMS + email to lead in under 60 seconds → notify owner → create CRM record.',
        'Add AI qualification: classify the lead as hot/warm/junk and write a one-line summary for the owner.',
        'Add a booking link that pulls real availability from Cal.com.',
        'Instrument it: log response time so you can screenshot "avg 41 seconds".',
        'Record the Loom. Show a stopwatch.'
      ], out:'Build 2 shipped. You now have the two demos that close home-service businesses.' },
      { d:5, title:'BUILD 3 — Review Engine', hrs:5, tasks:[
        'Job marked complete → wait 2 hrs → SMS asking for a rating 1-5.',
        'Branch: 4-5 goes straight to the Google review link; 1-3 routes privately to the owner with an alert.',
        'Add a reminder if no response in 48 hrs, then stop forever.',
        'Build a small dashboard (Sheet or Airtable interface) showing requests sent / reviews landed.',
        'Record the Loom, emphasising the negative-review interception branch.'
      ], out:'Build 3 shipped. This one sells itself because owners can see their star rating.' },
      { d:6, title:'Error handling, security, and not blowing up a client', hrs:5, tasks:[
        'Add retry logic, error branches and failure notifications to all three builds.',
        'Learn credential hygiene: never store client API keys in plain text, use the platform vault, use a dedicated account per client.',
        'Read the CASL + PIPEDA section in the Pitch tab. Add unsubscribe/STOP handling to every outbound message flow.',
        'Write a one-page "what happens if it breaks" doc. Clients ask this. Having the answer ready closes deals.',
        'Duplicate all 3 builds into clean, re-deployable templates.'
      ], out:'Three production-grade templates you can deploy for a new client in under an hour.' },
      { d:7, title:'Package week 1 into proof', hrs:4, tasks:[
        'Write a one-page case study for each build: the problem, the numbers, the fix, the result, a screenshot.',
        'Reframe your existing work as case studies too: the content production SOP, the product-audit engine, the multi-store payments rollout. That is 6 assets, not 3.',
        'Put them on a single-page site. Nothing fancy. Name, what you do, 6 proofs, a Cal.com link.',
        'Rest. You need to be sharp for the outreach weeks.'
      ], out:'A portfolio site with 6 case studies. You have never sold a service — now you have evidence.' }
    ]},
  { w:2, t:'Week 2 · n8n, AI agents, voice — the stuff they cannot copy',
    goal:'Move off no-code training wheels. By Sunday you own a server, an AI agent, and a voice receptionist.',
    days:[
      { d:8, title:'Self-host n8n', hrs:6, tasks:[
        'Spin up a $6/mo VPS (Hetzner or DigitalOcean). Install Docker.',
        'Deploy n8n with docker-compose, behind Caddy/Traefik with HTTPS and a subdomain.',
        'Set up Postgres as the backing store, plus automated backups. Do not skip backups.',
        'Rebuild Build 1 in n8n from scratch. Feel the difference in cost and control.',
        'Learn n8n queue mode and why it matters when you have 10 clients.'
      ], out:'Your own automation server. Marginal cost per new client: near zero.' },
      { d:9, title:'n8n deep work', hrs:6, tasks:[
        'Master the core nodes: HTTP Request, Code, Switch, Merge, Split In Batches, Wait, Error Trigger.',
        'Learn expressions and the data-mapping panel until you stop guessing.',
        'Build a sub-workflow and call it from a parent. This is how you stop repeating yourself.',
        'Set up environments: one instance/project per client, or at minimum strict project separation.',
        'Import 5 community templates, read them, then rebuild one from memory.'
      ], out:'n8n is no longer intimidating. It is your default tool.' },
      { d:10, title:'BUILD 4 — Inbox Triage Agent', hrs:6, tasks:[
        'Gmail/Outlook trigger → Claude classifies each email: new lead / existing customer / supplier / spam / needs owner.',
        'Auto-label and auto-archive. Draft a reply for the two most common categories — draft only, never auto-send.',
        'Escalation rule: anything containing urgency or a complaint pings the owner immediately.',
        'Learn prompt engineering properly here: system prompts, few-shot examples, forcing structured JSON output.',
        'Record the Loom on a mock inbox you seed with 40 realistic emails.'
      ], out:'Build 4 shipped. This is your foot in the door with professional services.' },
      { d:11, title:'BUILD 5 — AI Voice Receptionist', hrs:6, tasks:[
        'Pick one: Retell (fastest booking integration), Vapi (most control) or Synthflow (most no-code). Build on one, do not sample all three.',
        'Script the agent for a dental clinic: greet, answer 8 FAQs, check availability, book, confirm by SMS, escalate emergencies to a human.',
        'Connect it to a real calendar. Make it actually book.',
        'Handle the hard parts: interruptions, silence, accents, "let me speak to a person".',
        'Get the per-minute cost to a number you can quote from memory.'
      ], out:'Build 5 shipped. This is the demo that makes owners go quiet on a call.' },
      { d:12, title:'BUILD 6 — Database Reactivation Campaign', hrs:5, tasks:[
        'Take a CSV of old customers → clean and dedupe → AI writes a personalised one-liner per contact from their history.',
        'Drip it over SMS/email with strict consent and STOP handling.',
        'Route every reply into a live "interested" board the owner can watch fill up.',
        'Build the ROI calculator: contacts × response rate × close rate × avg job value.',
        'Record the Loom. Lead with the dollar figure.'
      ], out:'Build 6 shipped. This is the one that pays for your fee out of found money.' },
      { d:13, title:'BUILD 7 + 8 — Quote-from-Photo and the Owner\'s Brief', hrs:6, tasks:[
        'Build 7: customer texts photos of a job → vision model estimates scope → generates a branded PDF quote → sends for e-sign.',
        'Build 8: every Monday 7am, pull from their CRM/calendar/payments → one-page brief: money in, jobs booked, leads unanswered, reviews landed, the one thing to fix.',
        'Both get Looms.',
        'Turn all 8 into deployable templates with a setup checklist per build.'
      ], out:'Eight builds. Eight demos. A real portfolio.' },
      { d:14, title:'Build the demo machine', hrs:5, tasks:[
        'Create a "personalised demo" pipeline: given a business name + website, you can produce a branded working demo in under 45 minutes.',
        'Pre-write the demo landing page template with their logo and name on it.',
        'This is your unfair advantage. Nobody else shows up with the thing already built.',
        'Update the portfolio site with all 8 case studies. Add the demo request form.'
      ], out:'You can walk into any business with their own automation already running.' }
    ]},
  { w:3, t:'Week 3 · Outreach — the part that actually makes money',
    goal:'100 businesses contacted, 10 conversations, 3 free builds agreed. Volume is the whole game.',
    days:[
      { d:15, title:'Build the list', hrs:5, tasks:[
        'Pull 300 GTA businesses in your 3 verticals: Google Maps, Yelp, HomeStars, local BIA directories, Instagram location tags.',
        'Qualify on signals: fewer than 50 Google reviews, no online booking, rating under 4.3, ads running, "call us" with no form, owner-operated.',
        'Score each 1-3 on: do they have the problem, can they pay, can I reach the owner.',
        'Read the CASL rules in Pitch before you send anything. Fines are real.',
        'Load the top 100 into the Pipeline tab.'
      ], out:'100 qualified, scored prospects with a reason-to-call on each.' },
      { d:16, title:'Write and rehearse the pitch', hrs:5, tasks:[
        'Memorise the 30-second opener and the free-build offer until you can say it while distracted.',
        'Rehearse all 12 objections in the Pitch tab out loud. Record yourself. Watch it back. It will be bad. Do it again.',
        'Write your 3 email templates and 2 DM templates. Personalise the first line only — everything else stays fixed.',
        'Set up a simple booking page with 20-min "Automation Audit" slots.',
        'Do 5 practice calls to businesses outside your verticals. Burn the nerves on people who do not matter.'
      ], out:'You can pitch without reading. Nerves handled on throwaway calls.' },
      { d:17, title:'First real outreach day', hrs:6, tasks:[
        'Walk in to 15 local businesses. In person beats everything for GTA local — you are a face, not a spam folder.',
        'Send 30 CASL-compliant emails with a pre-built demo link for the top 10.',
        'Call 20. Expect most to go nowhere. Log every single one in Pipeline.',
        'Track your numbers: contacted, reached, interested, booked. You are gathering data, not just selling.',
        'End of day: write down the three objections you actually heard, not the ones you expected.'
      ], out:'~65 touches. First real conversations. Real objections to work with.' },
      { d:18, title:'Outreach day 2 + first audits', hrs:6, tasks:[
        'Same volume: 15 walk-ins, 30 emails, 20 calls.',
        'Run any booked audit calls. Use the discovery framework in Pitch — find the leak, quantify it in dollars, then offer the free build.',
        'For every audit, build the personalised demo BEFORE the follow-up call.',
        'Update your templates based on what actually landed yesterday.'
      ], out:'130 touches total. First audits done.' },
      { d:19, title:'Outreach day 3 + deliver free build #1', hrs:6, tasks:[
        'Same volume. Do not drop outreach because you got busy — that is how the pipeline dies.',
        'Deliver your first free build in a real business\'s real accounts.',
        'Set the 30-day measurement: agree upfront on the exact number you will both look at.',
        'Ask for a referral the moment they say "that\'s cool". Not later.'
      ], out:'First live client system. Even unpaid, this is a real reference.' },
      { d:20, title:'Outreach day 4 + follow-up sequence', hrs:6, tasks:[
        'Same volume. Plus: follow up on every no-reply from days 17-19. Most deals live in follow-up 2 through 5.',
        'Deliver free build #2.',
        'Post one build breakdown publicly — LinkedIn or a local business FB group. Inbound compounds; start it now.'
      ], out:'~260 touches. Two live systems.' },
      { d:21, title:'Review the funnel honestly', hrs:4, tasks:[
        'Compute your real rates: touches → conversations → audits → free builds agreed.',
        'Find the weakest step and fix only that. If nobody replies, the message is wrong. If they reply but do not book, the offer is wrong. If they book but do not proceed, the discovery is wrong.',
        'Cut the worst-performing vertical. Double the best one.',
        'Rest.'
      ], out:'A funnel you understand numerically instead of by feel.' }
    ]},
  { w:4, t:'Week 4 · Convert — free builds into paid contracts',
    goal:'Two paying clients. Not ten. Two, done properly, who will refer you.',
    days:[
      { d:22, title:'Outreach + deliver', hrs:6, tasks:[
        'Maintain volume: 15 walk-ins, 30 emails, 20 calls. Every single day this week.',
        'Deliver free build #3.',
        'Start collecting the numbers from build #1 — it has been running long enough to show something.'
      ], out:'Three live systems generating real data.' },
      { d:23, title:'The conversion conversation', hrs:6, tasks:[
        'Run the 30-day results review on build #1. Show the number. Then go quiet and let them talk first.',
        'Present the ladder: keep this running on retainer, or add the next automation, or both.',
        'Do not discount. If they say no, ask what would have to be true for it to be a yes, and log the answer.',
        'Maintain outreach volume regardless of how the call went.'
      ], out:'First paid offer made.' },
      { d:24, title:'Close #1', hrs:6, tasks:[
        'Get the first signature. Simple one-page agreement — scope, price, term, cancellation, who owns what.',
        'Set up billing: Stripe or PayPal recurring. Get paid before you build.',
        'Onboard properly: access checklist, kickoff call, a written 14-day plan.',
        'Keep outreach running.'
      ], out:'First revenue. The hardest dollar you will ever earn.' },

/* ============================================================
   HELPERS
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CARD = 'bg-white dark:bg-ink-850 rounded-2xl shadow-card border border-ink-200/70 dark:border-ink-800';

function ringSVG(pct, colorClass) {
  const r = 26, c = 2 * Math.PI * r;
  const off = c - (Math.min(pct, 100) / 100) * c;
  return `<div class="relative w-[72px] h-[72px] shrink-0">
    <svg width="72" height="72" viewBox="0 0 72 72" class="-rotate-90">
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="currentColor" stroke-width="7" class="text-ink-100 dark:text-ink-800"/>
      <circle cx="36" cy="36" r="${r}" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" class="${colorClass} ring-anim" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="absolute inset-0 flex items-center justify-center text-sm font-extrabold">${Math.round(pct)}%</div>
  </div>`;
}

function bar(pct, grad) {
  return `<div class="h-1.5 bg-ink-100 dark:bg-ink-800 rounded-full overflow-hidden"><div class="h-full ${grad} rounded-full transition-all duration-500" style="width:${Math.min(pct,100)}%"></div></div>`;
}

function confetti() {
  const bits = ['⚡','✅','💸','🚀','🔥'];
  for (let i = 0; i < 24; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-bit';
    el.textContent = bits[Math.floor(Math.random()*bits.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }
}

function openSheet(title, html) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheet').classList.remove('hidden');
  document.body.classList.add('modal-open');
}
function closeSheet() {
  document.getElementById('sheet').classList.add('hidden');
  document.body.classList.remove('modal-open');
}
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

function sprintTotals() {
  let total = 0, done = 0;
  SPRINT.forEach(w => w.days.forEach(d => d.tasks.forEach((_, i) => {
    total++; if (doneSprint[`${d.d}-${i}`]) done++;
  })));
  return { total, done, pct: total ? done/total*100 : 0 };
}
function dayDone(d) {
  return d.tasks.every((_, i) => doneSprint[`${d.d}-${i}`]);
}

    w.days.forEach(d => {

      const complete = cnt === d.tasks.length;

          </div>
        </div>
      </details>`;
    });
    h += `</div></div>`;
  });

  document.getElementById('tab-sprint').innerHTML = h;
  document.querySelectorAll('[data-sprint]').forEach(cb => cb.addEventListener('change', e => {
    // remember which day accordions are open so checking a box doesn't collapse them
    const openDays = [...document.querySelectorAll('#tab-sprint details[open]')].map(el => el.dataset.day);
    const k = e.target.dataset.sprint;

    });
    if (wasComplete && e.target.checked) confetti();

function copyScript(btn, id) {
  const s = SCRIPTS.find(x => x.id === id);
  if (!s || !navigator.clipboard) return;
  navigator.clipboard.writeText(s.body).then(() => {
    const old = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = old; }, 1400);
  }).catch(() => { btn.textContent = 'Copy failed — select the text above'; });
}

function addProspect() {
  const name = document.getElementById('pName').value.trim();
  if (!name) return;
  pipeline.push({
    id: 'p' + Date.now(),
    name,
    vert: document.getElementById('pVert').value.trim(),
    contact: document.getElementById('pContact').value.trim(),
    leak: document.getElementById('pLeak').value.trim(),
    stage: 'Prospect', note: ''
  });
  save(K.pipeline, pipeline); renderPipeline();
}
function setStage(id, s) {
  const p = pipeline.find(x => x.id === id);
  if (p) { p.stage = s; save(K.pipeline, pipeline); renderPipeline(); if (s === 'Paid') confetti(); }
}
function delProspect(id) {
  if (!confirm('Remove this prospect?')) return;
  pipeline = pipeline.filter(x => x.id !== id);
  save(K.pipeline, pipeline); renderPipeline();
}

    <div class="text-[11px] font-semibold uppercase tracking-widest text-emerald-100">Revenue</div>
    <div class="text-3xl font-extrabold tracking-tight mt-1 tabular-nums">$${total.toLocaleString()}</div>
    <div class="text-xs font-medium text-emerald-100 mt-0.5">$${mrr.toLocaleString()}/mo recurring · goal $${(+money.goal).toLocaleString()}</div>
    <div class="mt-4">
      <div class="flex justify-between text-[11px] font-semibold text-emerald-100 mb-1"><span>Progress</span><span>${Math.round(pct)}%</span></div>
      <div class="h-1.5 bg-white/20 rounded-full overflow-hidden"><div class="h-full bg-white/90 rounded-full transition-all duration-700" style="width:${Math.min(pct,100)}%"></div></div>
    </div>
  </div>

  <div class="mt-3 ${CARD} p-4 fade-up">
    <div class="text-[10px] font-bold uppercase tracking-widest text-ink-400 dark:text-ink-500 mb-2">Log revenue</div>
    <div class="grid grid-cols-2 gap-2">
      <input id="mClient" type="text" placeholder="Client" class="px-3 py-2.5 rounded-lg border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-900 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <input id="mAmt" type="number" placeholder="Amount $" class="px-3 py-2.5 rounded-lg border border-ink-200 dark:border-ink-700 bg-white dark:bg-ink-900 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <label class="flex items-center gap-2 mt-2 cursor-pointer">
      <input id="mRec" type="checkbox" class="w-5 h-5 rounded accent-emerald-600">
      <span class="text-[12px] font-semibold">Recurring (monthly retainer)</span>
    </label>
    <button onclick="addMoney()" class="mt-2 w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold transition active:scale-[0.98]">Log it</button>
  </div>

  ${money.entries.length ? `<div class="mt-3 ${CARD} overflow-hidden fade-up">
    <ul class="divide-y divide-ink-100 dark:divide-ink-800">
      ${money.entries.map(e => `<li class="px-4 py-3 flex items-center gap-3">
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold tracking-tight truncate">${esc(e.client)}</div>
          <div class="text-[10px] font-semibold text-ink-400 dark:text-ink-500">${esc(e.date)}${e.rec ? ' · recurring' : ' · one-time'}</div>
        </div>
        <div class="font-extrabold text-emerald-600 dark:text-emerald-400 tabular-nums">$${(+e.amt).toLocaleString()}</div>
        <button onclick="delMoney('${e.id}')" class="w-7 h-7 rounded-lg bg-ink-100 dark:bg-ink-800 text-ink-400 hover:text-red-500 text-xs transition">✕</button>
      </li>`).join('')}
    </ul>
  </div>` : ''}

  <h2 class="text-xl font-bold tracking-tight mt-5 mb-1">Pricing ladder</h2>
  <p class="text-[11px] font-medium text-ink-400 dark:text-ink-500 mb-2">Canadian local SMBs sit at the low end of global ranges. Start where you can win, then raise your price every third client.</p>
  <div class="space-y-2">
    ${PRICING.map(p => `<div class="${CARD} p-4">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="text-sm font-bold tracking-tight">${esc(p.tier)}</div>
          <div class="text-[12px] font-medium text-ink-500 dark:text-ink-400 mt-1 leading-snug">${esc(p.what)}</div>
        </div>
        <div class="shrink-0 text-sm font-extrabold text-emerald-600 dark:text-emerald-400 text-right">${esc(p.price)}</div>
      </div>
      <div class="mt-2 text-[11px] font-medium text-ink-400 dark:text-ink-500 leading-snug border-l-2 border-ink-200 dark:border-ink-700 pl-2">${esc(p.note)}</div>
    </div>`).join('')}
  </div>

  <h2 class="text-xl font-bold tracking-tight mt-5 mb-1">Your cost base</h2>
  <p class="text-[11px] font-medium text-ink-400 dark:text-ink-500 mb-2">Roughly $50-100/mo covers your whole operation until you have several clients. This is why the margin works.</p>
  <div class="${CARD} overflow-hidden">
    <ul class="divide-y divide-ink-100 dark:divide-ink-800">
      ${COSTS.map(c => `<li class="px-4 py-3">
        <div class="flex items-center gap-2">
          <div class="text-sm font-bold tracking-tight flex-1">${esc(c.n)}</div>
          <div class="text-[12px] font-extrabold text-ink-500 dark:text-ink-400 tabular-nums">${esc(c.c)}</div>
        </div>
        <div class="text-[11px] font-medium text-ink-400 dark:text-ink-500 mt-0.5 leading-snug">${esc(c.note)}</div>
      </li>`).join('')}
    </ul>
  </div>

  <div class="mt-3 ${CARD} p-4 fade-up border-l-4 border-l-indigo-500">
    <div class="text-[10px] font-bold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">The maths that matters</div>
    <p class="text-[12px] font-medium leading-snug mt-2">Four retainer clients at $750/mo is $3,000/mo against roughly $80/mo in costs. That is more than your current fixed monthly outflow, from four relationships — not four hundred.</p>
    <p class="text-[12px] font-medium leading-snug mt-2">This is why the free build is cheap for you and expensive-looking to them: your marginal cost per client is a rounding error, and their marginal value from one recovered job is often the whole fee.</p>
  </div>`;

  document.getElementById('tab-money').innerHTML = h;
}
function addMoney() {
  const client = document.getElementById('mClient').value.trim();
  const amt = +document.getElementById('mAmt').value;
  if (!client || !amt) return;
  money.entries.push({ id:'m'+Date.now(), client, amt, rec: document.getElementById('mRec').checked, date: new Date().toLocaleDateString('en-CA') });
  save(K.money, money); renderMoney(); confetti();
}
function delMoney(id) {
  money.entries = money.entries.filter(e => e.id !== id);
  save(K.money, money); renderMoney();
}

/* ============================================================
   TABS + DARK + BOOT
   ============================================================ */
const TABS = ['sprint','learn','build','pitch','pipeline','money'];
function setTab(name) {
  TABS.forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', name !== t));
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === name;
    btn.classList.toggle('text-indigo-600', active);
    btn.classList.toggle('dark:text-indigo-400', active);
    btn.classList.toggle('text-slate-500', !active);
    btn.classList.toggle('dark:text-slate-400', !active);
  });
  if (name === 'sprint')   renderSprint();
  if (name === 'learn')    renderLearn();
  if (name === 'build')    renderBuild();
  if (name === 'pitch')    renderPitch();
  if (name === 'pipeline') renderPipeline();
  if (name === 'money')    renderMoney();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));

const darkToggle = document.getElementById('darkToggle');
function applyDark(on) {
  document.documentElement.classList.toggle('dark', on);
  document.getElementById('iconMoon').classList.toggle('hidden', on);
  document.getElementById('iconSun').classList.toggle('hidden', !on);
  localStorage.setItem('dark-mode', on ? '1' : '0');
}
darkToggle.addEventListener('click', () => applyDark(!document.documentElement.classList.contains('dark')));
const savedDark = localStorage.getItem('dark-mode');
if (savedDark === '1') applyDark(true);
else if (savedDark === '0') applyDark(false);
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) applyDark(true);
else applyDark(false);

setTab('sprint');
</script>
</body>
</html>
